<!DOCTYPE html>
<html lang="km">
  <head>
    <meta charset="utf-8">
    <title>GoJapan 24hours - Japanese ISP & Telecom</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="shortcut icon" href="./favicon.ico">
    <script>
      // Single Page App redirect for GitHub Pages
      // If a deep path or subpath is loaded, redirect to the base index.html
      var pathname = window.location.pathname;
      var segments = pathname.split('/').filter(Boolean);
      var isGitHubPagesSubpath = window.location.hostname.endsWith('github.io');
      var basePath = isGitHubPagesSubpath && segments.length > 0 ? '/' + segments[0] + '/' : '/';
      window.location.replace(window.location.origin + basePath);
    </script>
  </head>
  <body style="font-family: sans-serif; text-align: center; padding-top: 50px; color: #475569;">
    <h2>កំពុងផ្ទុក GoJapan 24hours...</h2>
    <p>Loading application, please wait...</p>
  </body>
</html>
